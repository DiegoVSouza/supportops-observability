services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment: {POSTGRES_DB: supportops, POSTGRES_USER: supportops, POSTGRES_PASSWORD: supportops}
    ports: ["127.0.0.1:37432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U supportops"]
      interval: 2s
      retries: 30
  localstack:
    image: localstack/localstack:4.14.0
    environment: {SERVICES: sqs,sns}
    ports: ["127.0.0.1:34566:4566"]
