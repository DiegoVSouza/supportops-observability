[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "supportops-obs"
version = "0.3.1"
description = "Privacy-conscious observability primitives for agent workflows"
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "PyYAML==6.0.3", "supportops-agents==0.1.1; python_version >= '3.13'", "supportops-async==0.1.3; python_version >= '3.13'"]

[tool.uv.sources]
supportops-agents = { path = "artifacts/packages/supportops_agents-0.1.1-py3-none-any.whl" }
supportops-async = { path = "artifacts/packages/supportops_async-0.1.3-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["supportops_obs"]
